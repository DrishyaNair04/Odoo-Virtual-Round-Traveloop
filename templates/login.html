<!-- templates/login.html -->
{% extends "base.html" %}
{% block title %}Login - Traveloop{% endblock %}
{% block content %}
<div class="row justify-content-center min-vh-100 align-items-center">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="fas fa-plane-departure fa-3x" style="color: #3498db;"></i>
                <h2 class="mt-3" style="font-weight: 700;">Welcome Back</h2>
                <p class="text-muted">Sign in to continue your travel journey</p>
            </div>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="POST">
                <div class="mb-3"><label class="form-label">Email Address</label><input type="email" name="email" class="form-control" required placeholder="traveler@example.com"></div>
                <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
                <button type="submit" class="btn btn-primary w-100">Login <i class="fas fa-arrow-right ms-2"></i></button>
            </form>
            <hr>
            <p class="text-center mb-0">New to Traveloop? <a href="{{ url_for('signup') }}" class="text-decoration-none">Create an account</a></p>
            <p class="text-center mt-2"><small><a href="#" class="text-muted">Forgot Password?</a></small></p>
        </div>
    </div>
</div>
{% endblock %}
