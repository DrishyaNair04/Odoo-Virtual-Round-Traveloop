<!-- templates/signup.html -->
{% extends "base.html" %}
{% block title %}Sign Up - Traveloop{% endblock %}
{% block content %}
<div class="row justify-content-center min-vh-100 align-items-center">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="fas fa-globe-asia fa-3x" style="color: #2c3e50;"></i>
                <h2 class="mt-3" style="font-weight: 700;">Join Traveloop</h2>
                <p class="text-muted">Start planning your dream trips today</p>
            </div>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="POST">
                <div class="mb-3"><label class="form-label">Full Name</label><input type="text" name="name" class="form-control" required placeholder="John Doe"></div>
                <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
                <button type="submit" class="btn btn-primary w-100">Sign Up <i class="fas fa-user-plus ms-2"></i></button>
            </form>
            <hr>
            <p class="text-center mb-0">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
